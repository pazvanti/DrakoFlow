<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrakoFlow Player</title>
  <link rel="stylesheet" href="./dist/player.css">
</head>
<body>
  <div class="diagram-canvas-container" id="canvas-container">
    <!-- Tag Filter Bar -->
    <div class="tag-filter-bar" id="tag-filter-bar" style="display: none;">
      <span class="tag-filter-label">Filter:</span>
      <div class="tag-pills" id="tag-pills"></div>
      <button class="btn-clear-tags" id="btn-clear-tags" title="Clear Tag Filters">&times; Clear</button>
    </div>

    <!-- Main Diagram SVG Canvas -->
    <svg id="diagram-svg" class="diagram-svg">
      <defs id="svg-defs"></defs>
      <g id="viewport-g"></g>
    </svg>

    <!-- Floating Minimap -->
    <div class="minimap-container" id="minimap-container">
      <svg id="minimap-svg" class="minimap-svg" viewBox="0 0 160 110">
        <g id="minimap-content-g"></g>
        <rect id="minimap-viewport-rect" class="minimap-viewport-rect"></rect>
      </svg>
    </div>

    <!-- Floating Action Bar -->
    <div class="floating-controls">
      <button class="floating-btn" id="btn-zoom-in" title="Zoom In">
        <svg viewBox="0 0 16 16"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg>
      </button>
      <button class="floating-btn" id="btn-zoom-out" title="Zoom Out">
        <svg viewBox="0 0 16 16"><path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8z"/></svg>
      </button>
      <button class="floating-btn" id="btn-reset-zoom" title="Reset Zoom (1:1)">
        <svg viewBox="0 0 16 16"><path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg>
      </button>
      <button class="floating-btn" id="btn-fit-screen" title="Fit to Screen">
        <svg viewBox="0 0 16 16"><path d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z"/></svg>
      </button>
      <div class="toolbar-separator"></div>
      <button class="floating-btn" id="btn-toggle-minimap" title="Toggle Minimap">
        <svg viewBox="0 0 16 16"><path d="M15.804.8a.5.5 0 0 0-.5-.3L10.5 2.1 5.5.4 1 .9a.5.5 0 0 0-.4.5v13.5a.5.5 0 0 0 .6.5l4.8-1.6 5 1.7 4.5-.5a.5.5 0 0 0 .5-.5V.8zM6 1.8l4 1.4v11L6 12.8V1.8zm-1 0v11L1.2 14.2V2.2L5 1.8zm6 12.4V3.2l3.8-.4v11.9l-3.8.5z"/></svg>
      </button>
      <button class="floating-btn" id="btn-view-code" title="View Source Code">
        <svg viewBox="0 0 16 16"><path d="M10.478 1.647a.5.5 0 1 0-.956-.294l-4 13a.5.5 0 0 0 .956.294l4-13zM4.854 4.146a.5.5 0 0 1 0 .708L1.707 8l3.147 3.146a.5.5 0 0 1-.708.708l-3.5-3.5a.5.5 0 0 1 0-.708l3.5-3.5a.5.5 0 0 1 .708 0zm6.292 0a.5.5 0 0 0 0 .708L14.293 8l-3.147 3.146a.5.5 0 0 0 .708.708l3.5-3.5a.5.5 0 0 0 0-.708l-3.5-3.5a.5.5 0 0 0-.708 0z"/></svg>
      </button>
    </div>

    <div class="player-watermark">⚡ Made with DrakoFlow</div>
  </div>

  <!-- View Code Modal -->
  <div class="code-modal-overlay" id="code-modal-overlay">
    <div class="code-modal">
      <div class="code-modal-header">
        <span>DrakoFlow DSL Code</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="btn-copy-code-modal" class="modal-btn-copy" title="Copy DSL to Clipboard">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
            <span id="copy-code-modal-text">Copy</span>
          </button>
          <button id="btn-close-code-modal" style="background: none; border: none; color: #a1a1aa; cursor: pointer; font-size: 18px; padding: 2px 6px; line-height: 1;" title="Close">&times;</button>
        </div>
      </div>
      <pre class="code-modal-body" id="code-modal-body"></pre>
    </div>
  </div>

  <script src="./dist/player.js"></script>
</body>
</html>
